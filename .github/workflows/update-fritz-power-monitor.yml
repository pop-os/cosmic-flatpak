name: Update FRITZ!Power Monitor Flatpak

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-fritz-power-monitor-flatpak
  cancel-in-progress: false

jobs:
  update:
    name: Track latest upstream release
    runs-on: ubuntu-latest
    steps:
      - name: Check out Flatpak repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Resolve latest stable applet release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="$(gh api repos/gpkvt/cosmic-ext-fritzsmart-monitor-applet/releases/latest)"
          tag="$(jq -r '.tag_name' <<<"$release")"
          draft="$(jq -r '.draft' <<<"$release")"
          prerelease="$(jq -r '.prerelease' <<<"$release")"

          if [[ -z "$tag" || "$tag" == "null" || "$draft" == "true" || "$prerelease" == "true" ]]; then
            echo "::error::Latest applet release is not a published stable release"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Fetch release source and update manifest inputs
        id: prepare
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/fritz-power-monitor"

          git clone --quiet --depth 1 --branch "$RELEASE_TAG" \
            https://github.com/gpkvt/cosmic-ext-fritzsmart-monitor-applet.git "$source_dir"

          manifest_source="$source_dir/packaging/cosmic-flatpak/com.gpkvt.FritzPowerMonitor.json"
          cargo_sources="$source_dir/packaging/cosmic-flatpak/cargo-sources.json"
          cargo_lock="$source_dir/Cargo.lock"

          for file in "$manifest_source" "$cargo_sources" "$cargo_lock"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Required Flatpak source file is missing at $RELEASE_TAG: $file"
              exit 1
            fi
          done

          source_commit="$(git -C "$source_dir" rev-parse 'HEAD^{commit}')"
          destination="app/com.gpkvt.FritzPowerMonitor"
          mkdir -p "$destination"

          jq --arg tag "$RELEASE_TAG" --arg commit "$source_commit" '
            .modules[0].sources[0].tag = $tag |
            .modules[0].sources[0].commit = $commit
          ' "$manifest_source" > "$destination/com.gpkvt.FritzPowerMonitor.json"

          cp "$cargo_sources" "$destination/cargo-sources.json"

          jq -e '
            .id == "com.gpkvt.FritzPowerMonitor" and
            .modules[0].sources[0].url == "https://github.com/gpkvt/cosmic-ext-fritzsmart-monitor-applet.git" and
            (.modules[0].sources[0].commit | test("^[0-9a-f]{40}$")) and
            (.modules[0].sources[0].tag | startswith("v"))
          ' "$destination/com.gpkvt.FritzPowerMonitor.json" >/dev/null

          jq empty "$destination/cargo-sources.json"
          echo "Prepared Flatpak manifest for $RELEASE_TAG ($source_commit)"
          if git status --porcelain -- "$destination" | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the updated Flatpak
        if: steps.prepare.outputs.changed == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes flatpak flatpak-builder just
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          just build com.gpkvt.FritzPowerMonitor

      - name: Publish validated manifest update
        if: steps.prepare.outputs.changed == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/com.gpkvt.FritzPowerMonitor/com.gpkvt.FritzPowerMonitor.json app/com.gpkvt.FritzPowerMonitor/cargo-sources.json

          if git diff --cached --quiet; then
            echo "No manifest changes to publish."
            exit 0
          fi

          git commit -m "Update FRITZ!Power Monitor to $RELEASE_TAG"

          # The fork may be synchronized with upstream while the Flatpak build
          # is running. Rebase the validated manifest commit onto the latest
          # master before publishing, retrying if another push wins the race.
          for attempt in 1 2 3 4 5; do
            git fetch origin master
            git rebase origin/master
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "Push raced with another master update; retrying ($attempt/5)…"
            sleep "$attempt"
          done

          echo "::error::Could not publish after five attempts"
          exit 1
