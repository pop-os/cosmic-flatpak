app-id: io.github.maugustoldo.TilingAssistant
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: cosmic-tiling-manager
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=~/.config/cosmic
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/cosmic-tiling-manager/cargo
modules:
  - name: cosmic-tiling-manager
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml
      - cargo --offline build --release
      - install -Dm755 target/release/cosmic-tiling-manager -t /app/bin/
      - sed -i "s/cosmic-tiling-manager/io.github.maugustoldo.TilingAssistant/g" data/cosmic-tiling-manager.desktop
      - sed -i "s/Cosmic Tiling Manager/Tiling Assistant/g" data/cosmic-tiling-manager.desktop
      - install -Dm644 data/cosmic-tiling-manager.desktop /app/share/applications/io.github.maugustoldo.TilingAssistant.desktop
      - install -Dm644 data/cosmic-tiling-manager.svg /app/share/icons/hicolor/scalable/apps/io.github.maugustoldo.TilingAssistant.svg
      - sed -i "s/com.system76.CosmicTilingManager/io.github.maugustoldo.TilingAssistant/g" flatpak/com.system76.CosmicTilingManager.metainfo.xml
      - sed -i "s/Cosmic Tiling Manager/Tiling Assistant/g" flatpak/com.system76.CosmicTilingManager.metainfo.xml
      - install -Dm644 flatpak/com.system76.CosmicTilingManager.metainfo.xml /app/share/metainfo/io.github.maugustoldo.TilingAssistant.metainfo.xml
    sources:
      - type: git
        url: https://github.com/maugustoldo/cosmic-tiling-manager.git
        tag: v1.1.0
        commit: 93556528296ac203ee0f4ee7b4f0a41c795d4334
      - cargo-sources.json
