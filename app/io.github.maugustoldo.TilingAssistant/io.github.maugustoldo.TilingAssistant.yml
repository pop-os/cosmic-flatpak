app-id: io.github.maugustoldo.TilingAssistant
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: tiling-assistant
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=~/.config/cosmic
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/tiling-assistant/cargo
modules:
  - name: tiling-assistant
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml
      - cargo --offline build --release
      - install -Dm755 target/release/tiling-assistant -t /app/bin/
      - ln -s tiling-assistant /app/bin/cosmic-ext-tiling-manager
      - ln -s tiling-assistant /app/bin/tiling-manager
      - sed -i 's/StartupWMClass=.*/StartupWMClass=io.github.maugustoldo.TilingAssistant/' data/io.github.maugustoldo.TilingAssistant.desktop
      - install -Dm644 data/io.github.maugustoldo.TilingAssistant.desktop -t /app/share/applications/
      - install -Dm644 data/io.github.maugustoldo.TilingAssistant.svg -t /app/share/icons/hicolor/scalable/apps/
      - install -Dm644 flatpak/io.github.maugustoldo.TilingAssistant.metainfo.xml -t /app/share/metainfo/
    sources:
      - type: git
        url: https://github.com/maugustoldo/cosmic-tiling-manager.git
        tag: v1.1.1
        commit: 1a4297469f7ac45172d180dfc6472b45684b899b
      - cargo-sources.json
